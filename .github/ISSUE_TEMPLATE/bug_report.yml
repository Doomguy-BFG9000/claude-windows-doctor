name: Bug report
description: Something in claude-windows-doctor does not work as described
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove secrets, tokens and private paths from anything you paste. The tool prints an environment value only when its name or its value says it is a path or a switch, but a path can still name your user.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. For a wrong prediction of the shell (the Bash tool or the PowerShell tool), say which tools Claude Code really gave the model, and where Git for Windows is installed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install Git for Windows into ...
        2. Run claude-windows-doctor check ...
        3. See ...
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: The output of `claude --version`, or the desktop app's version.
      placeholder: 2.1.299
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where do you run Claude Code?
      options:
        - Terminal
        - Desktop app
        - VS Code
        - JetBrains
        - Web
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Windows, Node and Git versions
      description: The Windows version from `winver`, `node --version`, and `git --version`.
      placeholder: "Windows 11 24H2 (x64), Node 22.11, Git 2.51.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - npx from GitHub
        - Claude Code plugin marketplace
        - The toolkit setup page (npx -y github:nrzz/claude-code-toolkit)
        - git clone
        - Other
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: The exact output of the command, with secrets removed. For a wrong prediction, `claude-windows-doctor check --json` and, if you can run it, `claude-windows-doctor check --live`.
      render: text
